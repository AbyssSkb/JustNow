name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and require Swift 6.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          swift --version | tee "$RUNNER_TEMP/swift-version.txt"
          grep -Eq 'Swift version 6\.2([. ]|$)' "$RUNNER_TEMP/swift-version.txt"
      - name: Test
        run: swift test
      - name: Check editor wrapping and update signing
        run: |
          python3 scripts/check-editor-wrapping.py
          python3 scripts/check-update-signing.py
      - name: Check packaging scripts
        run: bash -n scripts/build-app.sh scripts/package-app.sh scripts/notarize.sh scripts/generate-update-feed.sh
      - name: Build universal app
        run: ./scripts/build-app.sh
      - name: Check single-instance journal protection
        run: python3 scripts/check-single-instance.py dist/JustNow.app/Contents/MacOS/JustNow
      - uses: actions/upload-artifact@v4
        with:
          name: JustNow-macOS-universal-ad-hoc
          path: |
            dist/JustNow-*-universal.zip
            dist/JustNow-*-universal.dmg
            dist/*SHA256.txt
          if-no-files-found: error
